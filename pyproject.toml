[project]
name = "e-com"
version = "0.1.0"
description = "Production-grade e-commerce backend platform for printer cartridges & printers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15.0",
    "django-environ>=0.11.0",
    "psycopg[binary]>=3.1.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "gunicorn>=22.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by ruff format)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --no-migrations"
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "config/*"]
